onboarding = false
[keys]
prefix = "ctrl+a"
split_vertical = ["prefix+v", "prefix+|"]
focus_pane_left = ["prefix+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = '"$HERDR_BIN_PATH" pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'
description = "break pane to new tab"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr pane"

[ui.toast]
delivery = "herdr"
delay_seconds = 15

[ui.toast.herdr]
position = "top-right"

[ui.sound]
enabled = false

[theme]
name = "gruvbox"
auto_switch = false
