# Bind prefix to Control+s
unbind C-b
set -g prefix C-s

# Split by | and -
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane switching with alt
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-style pane switching (prefix + hjkl)
# Edge-aware fall-through: at an edge pane, escalate to WM window focus
# (AeroSpace on macOS, i3 on Linux; no-op if neither is available)
bind h if-shell -F '#{pane_at_left}'   'run-shell "/opt/homebrew/bin/aerospace focus left 2>/dev/null || i3-msg focus left 2>/dev/null || true"'   'select-pane -L'
bind j if-shell -F '#{pane_at_bottom}' 'run-shell "/opt/homebrew/bin/aerospace focus down 2>/dev/null || i3-msg focus down 2>/dev/null || true"'   'select-pane -D'
bind k if-shell -F '#{pane_at_top}'    'run-shell "/opt/homebrew/bin/aerospace focus up 2>/dev/null || i3-msg focus up 2>/dev/null || true"'       'select-pane -U'
bind l if-shell -F '#{pane_at_right}'  'run-shell "/opt/homebrew/bin/aerospace focus right 2>/dev/null || i3-msg focus right 2>/dev/null || true"' 'select-pane -R'

# Mouse support
set -g mouse on

# Do not rename windows automatically
set-option -g allow-rename off

# Reload tmux config easy
bind r source-file ~/.tmux.conf

# Look and feel
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour1 bg=colour18 bold'

set -g pane-border-style 'fg=colour8 bg=colour0'
set -g pane-active-border-style 'fg=colour10 bg=colour0'

set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour8 fg=colour0'
set -g status-left ''
set -g status-right '#[fg=colour5 bg=colour0] #S #[fg=colour6 bg=colour0] #(ifconfig | grep -A 3 "tun" | grep "inet\ " |  cut -d" " -f2) #[fg=colour3 bg=colour0] #H #[fg=colour2 bg=colour0] %Y-%d-%m %H:%M '
set -g status-right-length 100
set -g status-left-length 20

setw -g window-status-current-style 'fg=colour16 bg=colour2 bold'
setw -g window-status-current-format ' #I #[fg=colour16]#W #[fg=colour16]#F '

setw -g window-status-style 'fg=colour15 bg=colour8 dim'
setw -g window-status-format ' #I #[fg=colour15]#W #[fg=colour15]#F '

setw -g window-status-bell-style 'fg=colour15 bg=colour1 bold'

set -g message-style 'fg=colour0 bg=colour4 bold'

# Scollback
set -g history-limit 10000

# Escape timeout to zero
set -sg escape-time 0

# Forward focus events to apps (e.g. Claude Code)
set -g focus-events on

# Vi(m) bindings
set-window-option -g mode-keys vi
# Yank to system clipboard: pbcopy on macOS, xclip on Linux/X11
if-shell 'command -v pbcopy' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -in -selection clipboard"'
